buildscript {
    group = "com.github.markOsipov"
    version = "0.0.1-SNAPSHOT"

    repositories {
        mavenCentral()
    }

    ext {
        shadow_version = "7.1.2"
        spring_version = "2.7.5"
        prometheus_version = "1.8.3"
        kotlin_version = "1.9.23"
        coroutine_version = "1.4.1"
        kmongo_version = "4.11.0"
        retrofit_ver = "2.9.0"
        okhttp_ver = "4.8.1"
        gson_ver = "2.8.6"
        logback_json_ver = "0.1.2"
        slack_api_ver = "1.32.0"
        springdoc_version = "1.8.0"
    }

}

plugins {
    id "org.springframework.boot" version "$spring_version"
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
    id 'java'
    id 'application'
}

apply plugin: 'kotlin'
apply plugin: 'java'

java.sourceCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
}

// springdoc 1.8 pulls Jackson 2.16 and SLF4J 2.x; Boot 2.7 needs Jackson 2.13 + SLF4J 1.7
// (logback 1.2 does not work with SLF4J 2 → log files stay empty)
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.fasterxml.jackson.core' ||
            details.requested.group == 'com.fasterxml.jackson.module' ||
            details.requested.group == 'com.fasterxml.jackson.datatype' ||
            details.requested.group == 'com.fasterxml.jackson.dataformat') {
            details.useVersion('2.13.5')
            details.because('Keep Jackson aligned with Spring Boot 2.7')
        }
        if (details.requested.group == 'org.slf4j') {
            details.useVersion('1.7.36')
            details.because('logback 1.2 is incompatible with SLF4J 2.x')
        }
    }
}

dependencies {
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutine_version")
    implementation("org.jetbrains.kotlin:kotlin-reflect")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")

    implementation("org.springframework.boot:spring-boot-starter-web:$spring_version")
    implementation("org.springframework.boot:spring-boot-starter-actuator:$spring_version")

    implementation "io.micrometer:micrometer-core:$prometheus_version"

    implementation("org.litote.kmongo:kmongo-coroutine:$kmongo_version")

    implementation("com.squareup.retrofit2:retrofit:$retrofit_ver") {
        exclude group: "com.squareup.okhttp3", module: "okhttp"
    }
    implementation("com.squareup.retrofit2:converter-gson:$retrofit_ver")
    implementation("com.squareup.retrofit2:converter-scalars:$retrofit_ver")
    implementation("com.squareup.okhttp3:okhttp:$okhttp_ver")
    implementation("com.squareup.okhttp3:logging-interceptor:$okhttp_ver")
    implementation("ch.qos.logback.contrib:logback-json-classic:$logback_json_ver")
    implementation("ch.qos.logback.contrib:logback-jackson:$logback_json_ver")

    implementation("com.slack.api:slack-api-client:$slack_api_ver")

    implementation("org.springdoc:springdoc-openapi-ui:$springdoc_version")
    implementation("org.springdoc:springdoc-openapi-kotlin:$springdoc_version")
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin")

    testImplementation("org.springframework.boot:spring-boot-starter-test:$spring_version")
}

compileKotlin {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "11"
        apiVersion = "1.9"
        languageVersion = "1.9"
    }
}

test {
    useJUnitPlatform()
}